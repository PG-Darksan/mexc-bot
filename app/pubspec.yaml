name: mexc_bot_app
description: MEXC USDT無期限先物の自動売買クライアント (Windows / Android)
publish_to: 'none'
version: 0.1.4+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  mexc_core:
    path: ../packages/mexc_core
  shared_preferences: ^2.3.5
  tray_manager: ^0.5.3
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
